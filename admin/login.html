<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — PixelPic Studio CMS</title>
  <link rel="icon" type="image/png" href="/favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="auth-wrapper">

  <div class="auth-card">
    <div class="auth-header">
      <a href="/index.html" title="Back to Website">
        <img src="/PixelPix_Studio.png" alt="PixelPic Studio" class="auth-logo">
      </a>
      <h1 class="auth-title">Studio Admin Access</h1>
      <p class="auth-subtitle">Enter your studio passcode to access video management</p>
    </div>

    <!-- LOGIN FORM -->
    <form id="adminLoginForm" class="auth-form">
      <div class="form-group">
        <label for="adminPasscode" class="form-label">Studio Password <span class="req">*</span></label>
        <div class="password-input-wrap">
          <input type="password" id="adminPasscode" class="form-input" placeholder="Enter admin password..." required autofocus autocomplete="current-password">
          <button type="button" class="btn-toggle-eye" aria-label="Toggle password visibility">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-muted);">
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="checkbox" id="rememberMeCheckbox" checked>
          <span>Remember on this browser</span>
        </label>
        <span style="font-size: 11px; color: var(--text-dim);">Default: <code>pixelpic2026</code></span>
      </div>

      <button type="submit" id="btnSubmitLogin" class="btn btn-primary" style="width: 100%; margin-top: 6px; padding: 12px;">
        Unlock Dashboard →
      </button>

      <div id="loginFeedback" style="display:none; font-size: 13px; padding: 10px 14px; border-radius: var(--radius-sm); margin-top: 6px;"></div>
    </form>

    <div class="auth-footer">
      <p><a href="/our-work.html" style="color: var(--text-muted);">← Return to Public Portfolio</a></p>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script>
    (function () {
      const DEFAULT_HASH = '202634f4e59165f48f28222d599c5a95198a44511ff43794689ceba7c7966fd3'; // SHA-256 for 'pixelpic2026'

      async function hashText(str) {
        const buffer = new TextEncoder().encode(str);
        const digest = await crypto.subtle.digest('SHA-256', buffer);
        return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
      }

      // Check if already authenticated
      if (sessionStorage.getItem('pixelpic_admin_auth') === 'true' || localStorage.getItem('pixelpic_admin_auth') === 'true') {
        window.location.replace('/admin/index.html');
      }

      const form = document.getElementById('adminLoginForm');
      const passInput = document.getElementById('adminPasscode');
      const rememberCheck = document.getElementById('rememberMeCheckbox');
      const btnSubmit = document.getElementById('btnSubmitLogin');
      const feedback = document.getElementById('loginFeedback');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        feedback.style.display = 'none';

        const entered = passInput.value.trim();
        if (!entered) return;

        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Verifying...';

        try {
          const inputHash = await hashText(entered);
          const savedHash = localStorage.getItem('pixelpic_admin_hash') || DEFAULT_HASH;

          if (inputHash === savedHash) {
            // Success!
            sessionStorage.setItem('pixelpic_admin_auth', 'true');
            if (rememberCheck.checked) {
              localStorage.setItem('pixelpic_admin_auth', 'true');
            } else {
              localStorage.removeItem('pixelpic_admin_auth');
            }

            feedback.style.display = 'block';
            feedback.style.background = 'rgba(16, 185, 129, 0.15)';
            feedback.style.color = '#10b981';
            feedback.style.border = '1px solid rgba(16, 185, 129, 0.3)';
            feedback.textContent = 'Passcode accepted! Loading dashboard...';

            setTimeout(() => {
              window.location.replace('/admin/index.html');
            }, 400);

          } else {
            feedback.style.display = 'block';
            feedback.style.background = 'rgba(239, 68, 68, 0.15)';
            feedback.style.color = '#ef4444';
            feedback.style.border = '1px solid rgba(239, 68, 68, 0.3)';
            feedback.innerHTML = 'Incorrect password. (Default is <code>pixelpic2026</code>)';
            passInput.focus();
            passInput.select();
          }
        } catch (err) {
          feedback.style.display = 'block';
          feedback.style.background = 'rgba(239, 68, 68, 0.15)';
          feedback.style.color = '#ef4444';
          feedback.textContent = 'Error: ' + err.message;
        } finally {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Unlock Dashboard →';
        }
      });

      // Toggle password eye
      document.querySelectorAll('.btn-toggle-eye').forEach(btn => {
        btn.addEventListener('click', () => {
          const input = btn.previousElementSibling;
          if (!input) return;
          const isPass = input.type === 'password';
          input.type = isPass ? 'text' : 'password';
          btn.innerHTML = isPass
            ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
            : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        });
      });
    })();
  </script>
</body>
</html>
